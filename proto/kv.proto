syntax = "proto3";

package yewukv.rpc;

message PutRequest {
  bytes key = 1;
  bytes value = 2;
}

message GetRequest {
  bytes key = 1;
}

message DeleteRequest {
  bytes key = 1;
}

message PingRequest {}

// Every request must have a nonzero request_id and exactly one operation.
// Application validation enforces these constraints after Protobuf parsing.
message KvRequest {
  uint64 request_id = 1;
  oneof operation {
    PutRequest put = 2;
    GetRequest get = 3;
    DeleteRequest del = 4;
    PingRequest ping = 5;
  }
}

message KvResponse {
  enum Code {
    OK = 0;
    NOT_FOUND = 1;
    INVALID_ARGUMENT = 2;
    INTERNAL = 3;
    BUSY = 4;
  }
  uint64 request_id = 1;
  Code code = 2;
  bytes value = 3;
  string error = 4;
}
